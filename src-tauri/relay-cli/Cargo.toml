[package]
name = "relay-cli"
version = "0.2.0"
description = "Headless CLI for Relay workspaces — reuses the desktop app's own Rust core"
edition = "2021"

[[bin]]
name = "relay-cli"
path = "src/main.rs"

[dependencies]
relay = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
