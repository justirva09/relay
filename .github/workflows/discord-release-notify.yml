name: Discord Release Notify

# Fires whenever a release is published — regardless of which workflow
# created it (release.yml's manual dispatch, or experimental-release.yml's
# auto-draft-on-merge) and regardless of whether it was published
# automatically or by clicking "Publish release" on a draft. Draft release
# assets aren't publicly downloadable, so this deliberately waits for the
# `published` event rather than `created` — by then every asset actually
# exists as a finished upload on the release.
#
# Relay is a public repo, so each asset's own browser_download_url is
# already publicly reachable — no re-hosting needed.
on:
  release:
    types: [published]
  # Manual retry/re-run for an existing release — e.g. the webhook post
  # failed, or you just want to re-post without publishing a whole new
  # release. Picking the release up by tag here instead of relying on the
  # `release` event payload, which workflow_dispatch never has.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re-)notify, e.g. v0.2.0-17"
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notify Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/notify-discord-release.mjs
