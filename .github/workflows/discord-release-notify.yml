name: Discord Release Notify

# Fires whenever a release is published — regardless of which workflow
# created it (release.yml's manual dispatch, or experimental-release.yml's
# auto-draft-on-merge) and regardless of whether it was published
# automatically or by clicking "Publish release" on a draft. Draft release
# assets aren't publicly downloadable, so this deliberately waits for the
# `published` event rather than `created` — by then every asset actually
# exists as a finished upload on the release.
#
# This repo is private, so a release asset's own browser_download_url only
# works for someone logged into GitHub with repo access — no good for a
# public Discord channel. scripts/notify-discord-release.mjs re-uploads the
# installers to a public Google Drive folder and posts those links instead.
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upload installers to Drive and notify Discord
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: node scripts/notify-discord-release.mjs
